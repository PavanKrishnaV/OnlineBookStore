# ============================================
# Online Bookstore - Application Configuration
# ============================================

# Application Name
spring.application.name=Online Bookstore

# Server Port
server.port=8088

# ============================================
# H2 Database Configuration (Default - No Setup Needed)
# ============================================
spring.datasource.url=jdbc:h2:mem:bookstoredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# MySQL Database Configuration (Uncomment to use MySQL)
# ============================================
# spring.datasource.url=jdbc:mysql://localhost:3306/bookstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For MySQL, use: spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Logging
# ============================================
logging.level.com.bookstore=INFO
logging.level.org.springframework.web=INFO
