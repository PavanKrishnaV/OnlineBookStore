<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVerse | Professional Online Bookstore</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <i class="fas fa-book-open"></i>
            <span>BookVerse</span>
        </a>
        <div class="nav-links">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item">Categories</a>
            <a href="#" class="nav-item">New Arrivals</a>
            <a href="#" class="nav-item">About</a>
        </div>
        <div class="nav-actions">
            <button class="icon-btn" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="searchToggle">
                <i class="fas fa-search"></i>
            </button>
            <div id="authLinks" style="display: flex; gap: 15px; align-items: center;">
                <a href="#" class="nav-item" id="loginBtn">Login</a>
                <button class="btn btn-primary" id="signupBtn">Sign Up</button>
            </div>
            <div id="userProfile" style="display: none; align-items: center; gap: 15px;">
                <span id="userNameDisplay">User</span>
                <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <button class="icon-btn" id="cartBtn">
                <i class="fas fa-shopping-cart"></i>
                <span class="badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="mainContent">
        <!-- Hero Section -->
        <section class="hero" id="heroSection">
            <div class="hero-content">
                <h1>Discover Your Next Great Adventure</h1>
                <p>Explore thousands of books across all genres. From timeless classics to modern bestsellers, find your perfect read at BookVerse.</p>
                <div class="hero-btns">
                    <button class="btn btn-primary">Browse Collection</button>
                    <button class="btn btn-outline">Featured Books</button>
                </div>
            </div>
        </section>

        <!-- Store Controls -->
        <section class="store-controls">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="bookSearch" placeholder="Search by title or author...">
            </div>
            <div class="filters" id="categoryFilters">
                <button class="filter-btn active" data-category="all">All Books</button>
                <button class="filter-btn" data-category="Fiction">Fiction</button>
                <button class="filter-btn" data-category="Science Fiction">Sci-Fi</button>
                <button class="filter-btn" data-category="Fantasy">Fantasy</button>
                <button class="filter-btn" data-category="Mystery">Mystery</button>
                <button class="filter-btn" data-category="Non-Fiction">Non-Fiction</button>
            </div>
        </section>

        <!-- Book Grid -->
        <section class="book-grid" id="bookGrid">
            <!-- Loading placeholder -->
            <div class="loading">Loading books...</div>
        </section>
    </main>

    <!-- Modal for Auth/Cart/Details -->
    <div id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
        <div id="modalContent" style="background:var(--bg-card); padding:30px; border-radius:var(--border-radius); max-width:500px; width:90%; position:relative;">
            <button id="closeModal" style="position:absolute; top:15px; right:15px; background:none; font-size:1.5rem; color:var(--text-muted);">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
